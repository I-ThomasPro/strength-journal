services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strength_journal
    ports:
      - "5432:5432"
    volumes:
      # postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strength_journal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
